name: Blob storage website CI

on:
    push:
        branches: [ main ]
    pull_request:
        branches: [ main ]

permissions:
  id-token: write
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'
        cache-dependency-path: cityoftraitors.com/package-lock.json

    - name: Install dependencies
      run: npm ci
      working-directory: cityoftraitors.com

    - name: Typecheck & Svelte Check
      run: npm run check
      working-directory: cityoftraitors.com

    - name: Run automated tests
      run: npm run test
      working-directory: cityoftraitors.com

  build:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: 20

    - name: Install dependencies
      run: npm ci
      working-directory: cityoftraitors.com

    - name: Build
      run: npm run build
      working-directory: cityoftraitors.com

    - name: Azure Login
      uses: azure/login@v2
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    - name: Upload to blob storage
      uses: azure/CLI@v2
      with:
        inlineScript: |
            # Sync build/ to $web and prune stale hashed assets from prior deployments
            az storage blob sync \
              --container '$web' \
              --account-name cityoftraitorscom \
              --source ./cityoftraitors.com/build \
              --auth-mode login \
              --delete-destination true

            # Immutable content-hashed build assets: 1 year cache
            az storage blob upload-batch \
              --destination '$web' \
              --destination-path '_app/immutable' \
              --account-name cityoftraitorscom \
              --source ./cityoftraitors.com/build/_app/immutable \
              --auth-mode login \
              --overwrite \
              --content-cache-control "public, max-age=31536000, immutable"

            # HTML pages: revalidate at browser, short edge TTL
            az storage blob upload-batch \
              --destination '$web' \
              --account-name cityoftraitorscom \
              --source ./cityoftraitors.com/build \
              --pattern "*.html" \
              --auth-mode login \
              --overwrite \
              --content-cache-control "public, max-age=0, s-maxage=300, must-revalidate"

            # Static media, fonts, RSS, sitemap, robots, security.txt
            for ext in webp jpg png svg ico woff2 xml txt; do
              az storage blob upload-batch \
                --destination '$web' \
                --account-name cityoftraitorscom \
                --source ./cityoftraitors.com/build \
                --pattern "*.$ext" \
                --auth-mode login \
                --overwrite \
                --content-cache-control "public, max-age=86400"
            done


    - name: logout
      run: |
            az logout
      if: always()
